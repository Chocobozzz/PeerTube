packages:
  - packages/*
  - apps/*
  - server
  - client
  - client/packages/*
  - client/src/standalone/player

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  bcrypt: true
  bufferutil: true
  core-js: true
  edgedriver: true
  es5-ext: true
  esbuild: true
  geckodriver: true
  ip-set: false
  lmdb: true
  msgpackr-extract: true
  node-datachannel: true
  protobufjs: true
  sharp: false
  utf-8-validate: true
  utp-native: true

blockExoticSubdeps: false

minimumReleaseAge: 1440

overrides:
  '@types/express': 4.17.9
  '@types/express-serve-static-core': 4.19.5
  # Security fixes for transitive deps pinned to vulnerable majors by their parent
  'basic-ftp@<6.2.4': ^6.2.4
  'nodemailer@<10.1.4': ^10.3.1
  'serialize-javascript@<7.1.3': ^7.1.4
  'uuid@<11.1.1': ^11.1.1
  '@maildev/mcp>zod': ^4.6.7

patchedDependencies:
  node-media-server: pnpm-patches/node-media-server.patch
  sequelize: pnpm-patches/sequelize.patch
  tinykeys: pnpm-patches/tinykeys.patch
  video.js: pnpm-patches/video.js.patch
