name: Stats

permissions: {}

on:
  push:
    branches:
    - develop
    - ci
    - next
  pull_request:
    types: [synchronize, opened]

jobs:

  stats:
    runs-on: ubuntu-latest

    env:
      CI_BRANCH_BASE: develop

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: './.github/actions/reusable-prepare-peertube-build'
        with:
          node-version: '22.x'

      - name: Build
        run: npm run build -- --analyze-bundle

      - name: PeerTube code stats
        if: github.event_name != 'pull_request'
        env:
          SCC_VERSION: '3.0.0'
          SCC_SHA256: '13ca47ce00b5bd032f97f3af7aa8eb3c717b8972b404b155a378b09110e4aa0c'
        run: |
          set -euo pipefail

          curl -fsSL -o "$RUNNER_TEMP/scc.zip" "https://github.com/boyter/scc/releases/download/v$SCC_VERSION/scc-$SCC_VERSION-x86_64-unknown-linux.zip"
          echo "$SCC_SHA256  $RUNNER_TEMP/scc.zip" | sha256sum --check --strict
          unzip -o "$RUNNER_TEMP/scc.zip" scc -d "$RUNNER_TEMP/scc"

          "$RUNNER_TEMP/scc/scc" --format=json --exclude-dir .git,node_modules,client/node_modules,client/dist,dist,pnpm-lock.yaml,client/src/locale,test1,test2,test3,client/src/assets/images,config,storage,packages/tests/fixtures,support/openapi,.idea,.vscode,docker-volume,ffmpeg-3,ffmpeg-4 > ./scc.json

      - name: PeerTube client stats
        if: github.event_name != 'pull_request'
        run: |
          npm run -s client:build-stats > client-build-stats.json

      - name: PeerTube client lighthouse report
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get install chromium-browser
          sudo npm install -g lighthouse@13.5.0
          lighthouse --chrome-flags="--disable-gpu --no-sandbox --no-zygote --headless=new" https://peertube2.cpy.re --output=json --output-path=./lighthouse.json

      - name: Display stats
        if: github.event_name != 'pull_request'
        run: |
          cat client-build-stats.json
          cat scc.json
          cat lighthouse.json

      - name: Upload stats
        if: github.event_name != 'pull_request'
        uses: './.github/actions/reusable-deploy'
        with:
          source: lighthouse.json client-build-stats.json scc.json
          destination: peertube-stats
          knownHosts: ${{ secrets.STATS_DEPLOYEMENT_KNOWN_HOSTS }}
          deployKey: ${{ secrets.STATS_DEPLOYEMENT_KEY }}
          deployUser: ${{ secrets.STATS_DEPLOYEMENT_USER }}
          deployHost: ${{ secrets.STATS_DEPLOYEMENT_HOST }}
