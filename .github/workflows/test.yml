name: Test

permissions: {}

on:
  push:
  pull_request:
    types: [synchronize, opened]
  schedule:
    - cron: '0 3 * * 1-5'

jobs:

  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        ports:
          - 6379:6379

      postgres:
        image: postgres:14
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: peertube
          POSTGRES_HOST_AUTH_METHOD: trust

      # Only used by external-plugins tests, that only run on schedule. A service with an empty image does not start
      ldap:
        image: ${{ matrix.test_suite == 'external-plugins' && github.event_name == 'schedule' && 'chocobozzz/docker-test-openldap' || '' }}
        ports:
          - 10389:10389

      s3:
        image: ghcr.io/scality/cloudserver:9.3.20
        ports:
          - 9444:8000
        env:
          S3BACKEND: mem
          REMOTE_MANAGEMENT_DISABLE: 1
          SCALITY_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          SCALITY_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

      # Only used by external-plugins tests, that only run on schedule
      keycloak:
        image: ${{ matrix.test_suite == 'external-plugins' && github.event_name == 'schedule' && 'chocobozzz/peertube-tests-keycloak' || '' }}
        ports:
          - 8082:8080
        env:
          KC_BOOTSTRAP_ADMIN_USERNAME: admin
          KC_BOOTSTRAP_ADMIN_PASSWORD: admin

    strategy:
      fail-fast: false
      matrix:
        # Longest suites first. API suites are balanced using scripts/ci/test-durations.txt
        test_suite:
          - api-live-scalability
          - api-server
          - api-users-stats
          - api-check-params-search
          - api-videos-1
          - api-videos-2
          - api-transcoding-1
          - api-transcoding-2
          - api-moderation-notifications
          - api-federation
          - api-object-storage
          - transcription
          - cli-plugin
          - client
          - types-package
          - lint
          - external-plugins

    env:
      PGUSER: peertube
      PGHOST: localhost
      NODE_PENDING_JOB_WAIT: 250
      ENABLE_OBJECT_STORAGE_TESTS: true
      # Github runner IPs are blocked by youtube
      DISABLE_HTTP_YOUTUBE_IMPORT_TESTS: true
      ENABLE_FFMPEG_THUMBNAIL_PIXEL_COMPARISON_TESTS: true
      YOUTUBE_DL_DOWNLOAD_BEARER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      YOUTUBE_DL_PROXY: ${{ secrets.YOUTUBE_DL_PROXY }}

    steps:
      - uses: actions/checkout@v5

      - uses: './.github/actions/reusable-prepare-peertube-build'
        with:
          node-version: '22.x'

      - uses: './.github/actions/reusable-prepare-peertube-run'

      - name: Cache fixtures
        uses: actions/cache@v5
        with:
          path: |
            fixtures
          key: ${{ runner.OS }}-fixtures-${{ matrix.test_suite }}-${{ hashFiles('fixtures/*') }}
          restore-keys: |
            ${{ runner.OS }}-fixtures-${{ matrix.test_suite }}-
            ${{ runner.OS }}-fixtures-
            ${{ runner.OS }}-

      - name: Cache PeerTube pip directory
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.OS }}-${{ matrix.test_suite }}-pip-v1

      - name: Cache Hugging Face models
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
          key: ${{ runner.OS }}-${{ matrix.test_suite }}-hugging-face-v1

      # Transcription tools take a lot of disk space, we need to cleanup before running transcription tests
      - name: Cleanup disk space
        if: matrix.test_suite == 'transcription' || matrix.test_suite == 'external-plugins'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a
          df -h

      - name: Set env test variable (schedule)
        if: github.event_name != 'schedule'
        run: |
          echo "DISABLE_HTTP_IMPORT_TESTS=true" >> $GITHUB_ENV

      # Install PG to setup a secondary database for read replica tests
      - name: Setup PostgreSQL server binaries
        if: matrix.test_suite == 'api-server'
        run: |
          # Only install binaries, without creating and starting a main cluster
          sudo mkdir -p /etc/postgresql-common/createcluster.d
          echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.d/00-peertube.conf
          sudo apt-get install -y postgresql
          echo "/usr/lib/postgresql/$(ls /usr/lib/postgresql | sort -V | tail -n 1)/bin" >> $GITHUB_PATH
          echo "ENABLE_DB_REPLICA_TESTS=true" >> $GITHUB_ENV

      - name: Run Test
        # external-plugins tests only run on schedule
        if: github.event_name == 'schedule' || matrix.test_suite != 'external-plugins'
        env:
          AKISMET_KEY: ${{ secrets.AKISMET_KEY }}
        run: npm run ci -- ${{ matrix.test_suite }}

      - name: Display errors
        if: ${{ always() }}
        run: |
          ( \
            test -f dist/scripts/parse-log.js && \
            NODE_ENV=test node dist/scripts/parse-log.js -l error -f artifacts/*.log \
          ) || \
          echo "parse-log.js script does not exist, skipping."

      # Output of every failed attempt, including the ones of flaky test files that passed after a retry
      - name: Display failed test attempts
        if: ${{ always() && hashFiles('artifacts/failed-attempts/*') != '' }}
        run: |
          for file in artifacts/failed-attempts/*; do
            echo "::group::$file"
            cat "$file"
            echo "::endgroup::"
          done

      - name: Upload logs and database
        uses: actions/upload-artifact@v7
        if: ${{ failure() || hashFiles('artifacts/failed-attempts/*') != '' }}
        with:
          name: test-storages-${{ matrix.test_suite }}
          path: artifacts
          retention-days: 7
