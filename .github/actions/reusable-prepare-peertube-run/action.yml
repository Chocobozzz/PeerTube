name: "Reusable prepare PeerTube run"
description: "Reusable prepare PeerTube run"

runs:
  using: "composite"

  steps:
    - name: Setup system dependencies
      shell: bash
      run: |
        sudo apt-get update
        # nscd: this static FFmpeg build links glibc statically and crashes (SIGSEGV) when resolving a host name
        # With nscd running, it asks the daemon instead
        sudo apt-get install postgresql-client-common redis-tools parallel libimage-exiftool-perl nscd
        # The pip version of Ubuntu 22.04 (22.0.2) crashes in its resolver (AssertionError in get_topological_weights)
        # when installing whisper dependencies
        sudo python3 -m pip install --upgrade pip
        wget --quiet --no-check-certificate "https://download.cpy.re/ffmpeg/ffmpeg-release-4.3.1-64bit-static.tar.xz"
        tar xf ffmpeg-release-4.3.1-64bit-static.tar.xz
        mkdir -p $HOME/bin
        cp ffmpeg-*/{ffmpeg,ffprobe} $HOME/bin
        echo "$HOME/bin" >> $GITHUB_PATH
