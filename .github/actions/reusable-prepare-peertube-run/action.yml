name: "Reusable prepare PeerTube run"
description: "Reusable prepare PeerTube run"

runs:
  using: "composite"

  steps:
    - name: Setup system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install postgresql-client-common redis-tools parallel libimage-exiftool-perl
        # The pip version of Ubuntu 22.04 (22.0.2) crashes in its resolver
        sudo python3 -m pip install --upgrade --ignore-installed pip
        wget --quiet "https://download.cpy.re/ffmpeg/ffmpeg-n5.1.6-11-gcde3c5fc0c-linux64-gpl-5.1.tar.xz"
        tar xf ffmpeg-n5.1.6-11-gcde3c5fc0c-linux64-gpl-5.1.tar.xz
        mkdir -p $HOME/bin
        cp ffmpeg-n5.1.6-*/bin/{ffmpeg,ffprobe} $HOME/bin
        echo "$HOME/bin" >> $GITHUB_PATH
