name: "Reusable prepare PeerTube run"
description: "Reusable prepare PeerTube run"

inputs:
  ffmpeg-version:
    required: false
    default: 'n5.1.6-11-gcde3c5fc0c-linux64-gpl-5.1'
    description: 'Version of the FFmpeg build downloaded from download.cpy.re'
  ffmpeg-sha256:
    required: false
    default: '23af879fd5411f55136bd58a8e7e8c38d42e75ed872d385381b6ce9043bca2d4'
    description: 'SHA256 checksum of the FFmpeg archive, to update with ffmpeg-version'

runs:
  using: "composite"

  steps:
    - name: Setup system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install postgresql-client-common redis-tools parallel libimage-exiftool-perl
        # The pip version of Ubuntu 22.04 (22.0.2) crashes in its resolver
        sudo python3 -m pip install --upgrade --ignore-installed pip==26.2.2

    - name: Cache FFmpeg
      id: ffmpeg-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/ffmpeg
        key: ffmpeg-${{ inputs.ffmpeg-version }}-${{ inputs.ffmpeg-sha256 }}

    - name: Download FFmpeg
      if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        FFMPEG_VERSION: ${{ inputs.ffmpeg-version }}
        FFMPEG_SHA256: ${{ inputs.ffmpeg-sha256 }}
      run: |
        set -euo pipefail

        archive="$RUNNER_TEMP/ffmpeg.tar.xz"
        curl -fsSL -o "$archive" "https://download.cpy.re/ffmpeg/ffmpeg-$FFMPEG_VERSION.tar.xz"
        echo "$FFMPEG_SHA256  $archive" | sha256sum --check --strict

        mkdir -p "$HOME/ffmpeg"
        tar xJf "$archive" -C "$HOME/ffmpeg" --strip-components 2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
        rm "$archive"

    - name: Install FFmpeg
      shell: bash
      run: | # zizmor: ignore[github-env] constant path
        mkdir -p $HOME/bin
        cp $HOME/ffmpeg/{ffmpeg,ffprobe} $HOME/bin
        echo "$HOME/bin" >> $GITHUB_PATH
