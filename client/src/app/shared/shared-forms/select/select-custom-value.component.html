<div class="d-flex align-items-center">
  <my-select-options
    class="flex-grow-1"

    [inputId]="inputId()"
    [disabled]="disabled"

    [items]="itemsWithCustom"
    [(ngModel)]="selectedId" [ngModelOptions]="{ standalone: true }"
    (ngModelChange)="onModelChange()"
  ></my-select-options>

  @if (isCustomValue()) {
    <input
      [attr.aria-labelledby]="labelId()" [(ngModel)]="customValue" [ngModelOptions]="{ standalone: true }" (ngModelChange)="onModelChange()"
      [type]="inputType()" class="ms-2 form-control pt-input-text"
      />

    @if (inputSuffix()) {
      <span class="ms-1">{{ inputSuffix() }}</span>
    }
  }
</div>
