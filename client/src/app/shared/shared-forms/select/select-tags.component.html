<p-autoComplete
  class="w-100"
  [(ngModel)]="selectedItems" [ngModelOptions]="{ standalone: true }"
  (ngModelChange)="onModelChange()"
  [placeholder]="placeholder()"
  [inputId]="inputId()"
  [separator]="separator"
  [class.small]="small()"
  multiple="true"
  [typeahead]="false"
></p-autoComplete>
