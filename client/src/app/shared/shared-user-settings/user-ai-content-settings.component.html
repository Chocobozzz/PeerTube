<form (ngSubmit)="updateDetails()" [formGroup]="form">
  <div class="form-group">
    <div class="anchor" id="ai-content"></div>

    <div class="label" i18n>Hide videos</div>

    <div class="form-group-description" i18n>
      The use of AI is declared by video creators. Other platforms may not provide this information.
    </div>

    <div class="form-group mb-2">
      <my-peertube-checkbox inputName="hideAIGenerated" formControlName="hideAIGenerated" i18n-labelText labelText="Generated by AI"></my-peertube-checkbox>
    </div>

    <div class="form-group mb-2">
      <my-peertube-checkbox inputName="hideContainsAI" formControlName="hideContainsAI" i18n-labelText labelText="Containing AI-generated content"></my-peertube-checkbox>
    </div>

    <div class="form-group mb-2">
      <my-peertube-checkbox
        inputName="hideNotSpecified" formControlName="hideNotSpecified" i18n-labelText labelText="Not specifying whether AI has been used"
      ></my-peertube-checkbox>
    </div>
  </div>

  @if (!reactiveUpdate()) {
    <input type="submit" i18n-value value="Save AI-generated content settings" [disabled]="!form.valid" class="peertube-button primary-button mt-3">
  }
</form>
