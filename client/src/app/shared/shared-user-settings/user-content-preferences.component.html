<form (ngSubmit)="updateDetails()" [formGroup]="form">
  <div class="form-group">
    <div class="anchor" id="video-languages-subtitles"></div>

    <div class="pt-label-container">
      <label i18n for="videoLanguages">Only display videos in the following languages/subtitles</label>
    </div>

    <div>
      <my-select-languages inputId="videoLanguages" [maxLanguages]="20" formControlName="videoLanguages"></my-select-languages>
    </div>
  </div>

  <div class="form-group">
    <div class="anchor" id="video-categories"></div>

    <div class="pt-label-container">
      <label i18n for="videoCategories">Only display videos in the following categories</label>
    </div>

    <div>
      <my-select-categories inputId="videoCategories" formControlName="videoCategories"></my-select-categories>
    </div>
  </div>

  <div class="form-group">
    <my-select-radio
      [items]="videoLiveItems"
      inputId="videoLive"
      isGroup="true"
      i18n-label
      label="Only display videos of the following types"
      formControlName="videoLive"
    ></my-select-radio>
  </div>

  @if (!reactiveUpdate()) {
    <input type="submit" i18n-value value="Save content preferences" [disabled]="!form.valid" class="peertube-button primary-button mt-3">
  }
</form>
